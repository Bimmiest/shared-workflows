name: Settings

# The settings of this repository against the repo-template checklist (#16),
# with the action that this repository ships. A setting drifts with no
# commit, so a check on push does not see the drift. Thus it runs each week.
#
# SETTINGS_READ_TOKEN is a fine-grained token with "Administration: read" on
# this repository. GITHUB_TOKEN cannot read most of these settings. Without
# the secret, the check fails, and the issue below says so.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # `./` rather than `$/`, for the reason ci.yml gives.
      - name: The settings match the template
        uses: ./.github/actions/repo-settings-check # zizmor: ignore[self-repository]
        with:
          token: ${{ secrets.SETTINGS_READ_TOKEN }}

  # A failed scheduled run opens an issue, or comments on the open one. No
  # checkout, so the token that can write issues never meets the code that
  # the run executed. The action is pinned to a release, as a consumer pins it.
  report:
    needs: [settings]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: Bimmiest/shared-workflows/.github/actions/open-or-update-issue@d8fe1212e8569b10ca241d597d5f13ea0c04bb04 # v1.6.0
        with:
          label: scheduled-settings
          title: A repository setting differs from the template
          body: |
            The weekly settings check found a setting that differs from the repo-template checklist, or a setting that the token cannot read. The run log names each one and what to change.

            Run: {run}
