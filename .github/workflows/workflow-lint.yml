name: Workflow lint

# Reusable: the workflows are code too, and some of them hold tokens.
# actionlint catches what GitHub would only reject at run time (bad
# expressions, unknown inputs, shellcheck findings in `run:` blocks); zizmor
# catches what GitHub happily runs (template injection, persisted credentials,
# unpinned or impostor action refs). zizmor also reads dependabot.yml.
#
#   jobs:
#     workflow-lint:
#       uses: Bimmiest/shared-workflows/.github/workflows/workflow-lint.yml@<sha> # vX.Y.Z
#
# A deliberate zizmor finding gets an inline `# zizmor: ignore[<audit>]` with
# the reason beside it, in the caller's workflow.
on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner labels, as a JSON array. The runner needs Go and shellcheck (ubuntu-latest has both).
        type: string
        default: '["ubuntu-latest"]'
      actionlint-version:
        description: The actionlint module version to build. Exact, so a new release cannot fail an unrelated pull request.
        type: string
        default: v1.7.12
      zizmor-version:
        description: The zizmor version the action installs. Exact, for the same reason.
        type: string
        default: 1.30.1

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  workflow-lint:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built from a tagged module version rather than fetched by a download
      # script: the Go checksum database pins the source, so this version
      # cannot change under us. GOTOOLCHAIN=auto fetches a newer Go if the
      # module needs one.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: ${{ inputs.zizmor-version }}
          # Findings as PR annotations and a failed step, not a SARIF upload:
          # that needs `security-events: write`, and nothing else here does.
          advanced-security: false
          annotations: true
