name: CI

# This repository's own gates. The scripts behind the composite actions are
# unit-tested with Node's own runner, so the repository needs no install; the
# two reusable workflows are run against this repository, which is how they
# are proved to be callable at all.
on:
  pull_request:
  push:
    branches: [main]
  # Weekly, because the security job's verdict changes without a push.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight run for the same pull request. Never
# cancel main: its result is the record of whether the default branch is green.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The floors are in package.json. They hold one direction only: raise
      # them by hand when a change adds tests (docs/adr/0003).
      - name: Script tests and coverage floor
        run: npm run test:coverage

      # The checks are run against this repository too, so the action.yml
      # wiring (paths, flags, env) is exercised and not only the scripts.
      #
      # `./` rather than the `$/` self-repository syntax zizmor asks for:
      # GitHub has accepted `$/` since 2026-07-30, but actionlint 1.7.12 (the
      # newest release, 2026-03-30) rejects it as a malformed ref, and both
      # linters run on this file. Switch when actionlint learns it, and drop
      # the ignores.
      - name: docs-check, on this repository
        uses: ./.github/actions/docs-check # zizmor: ignore[self-repository]

      - name: node-patch-check, on this repository
        uses: ./.github/actions/node-patch-check # zizmor: ignore[self-repository]
        with:
          warn-only: ${{ github.event_name == 'pull_request' }}
          eol-days: 90

      - name: baseline-check, on this repository
        uses: ./.github/actions/baseline-check # zizmor: ignore[self-repository]

  # Each script-backed action against a fixture in test/fixtures/ that must
  # pass and one that must fail (#18). The unit tests prove the scripts. This
  # proves the action.yml around them: the paths, the inputs and the
  # environment. A path that breaks also fails the fixture that must pass.
  #
  # Not here: pr-hygiene reads the pull_request event, and pr-hygiene.yml runs
  # it on every pull request. playwright-browser needs @playwright/test
  # installed, and open-or-update-issue writes issues.
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Node and the fixture project, so it is also the Node that the
      # other actions run on.
      - name: setup-node-project
        uses: ./.github/actions/setup-node-project # zizmor: ignore[self-repository]
        with:
          cache-dependency-path: test/fixtures/project/package-lock.json
          working-directory: test/fixtures/project

      - name: coverage-ratchet
        uses: ./.github/actions/coverage-ratchet # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/coverage-ratchet/pass

      - name: audit-check
        uses: ./.github/actions/audit-check # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/project

      - name: licence-check
        uses: ./.github/actions/licence-check # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/project

      - name: package-contents-check
        uses: ./.github/actions/package-contents-check # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/package-contents-check/pass

      - name: lockfile-nesting-check
        uses: ./.github/actions/lockfile-nesting-check # zizmor: ignore[self-repository]
        with:
          base: base-package-lock.json
          level: fail
          working-directory: test/fixtures/lockfile-nesting-check/pass

      - name: dependabot-review-facts
        uses: ./.github/actions/dependabot-review-facts # zizmor: ignore[self-repository]
        with:
          # The fixture's lockfile against itself: no change, and no need for HEAD^1.
          base-ref: HEAD
          out: ${{ runner.temp }}/facts.json
          working-directory: test/fixtures/project

      # A stand-in for the Messages API, so the review runs with no key and
      # no cost: /good answers with a verdict, /bad with a server error.
      - name: Start a stand-in for the Messages API
        run: |
          node -e '
            const reply = { model: "claude-opus-5-5", stop_reason: "end_turn",
              content: [{ type: "text", text: JSON.stringify({ verdict: "merge", reasons: [{ text: "Nothing breaks.", file: null }] }) }] };
            require("node:http").createServer((req, res) => {
              const good = req.url === "/good/v1/messages";
              res.writeHead(good ? 200 : 500, { "content-type": "application/json" });
              res.end(JSON.stringify(good ? reply : { error: { type: "api_error" } }));
            }).listen(8787);
          ' &
          for _ in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 0.25; done

      - name: dependabot-review
        uses: ./.github/actions/dependabot-review # zizmor: ignore[self-repository]
        with:
          api-key: not-a-secret
          facts: ${{ runner.temp }}/facts.json
          api-url: http://127.0.0.1:8787/good
          comment-file: ${{ runner.temp }}/comment.md

      - name: The review wrote its comment
        env:
          COMMENT: ${{ runner.temp }}/comment.md
        run: |
          grep -q 'shared-workflows:dependabot-review' "$COMMENT"
          grep -q 'Verdict: merge' "$COMMENT"

      - name: coverage-ratchet (must fail)
        id: coverage-ratchet
        continue-on-error: true
        uses: ./.github/actions/coverage-ratchet # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/coverage-ratchet/fail

      - name: audit-check (must fail)
        id: audit-check
        continue-on-error: true
        uses: ./.github/actions/audit-check # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/audit-check/fail

      - name: licence-check (must fail)
        id: licence-check
        continue-on-error: true
        uses: ./.github/actions/licence-check # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/licence-check/fail

      - name: package-contents-check (must fail)
        id: package-contents-check
        continue-on-error: true
        uses: ./.github/actions/package-contents-check # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/package-contents-check/fail

      - name: lockfile-nesting-check (must fail)
        id: lockfile-nesting-check
        continue-on-error: true
        uses: ./.github/actions/lockfile-nesting-check # zizmor: ignore[self-repository]
        with:
          base: base-package-lock.json
          level: fail
          working-directory: test/fixtures/lockfile-nesting-check/fail

      - name: dependabot-review-facts (must fail)
        id: dependabot-review-facts
        continue-on-error: true
        uses: ./.github/actions/dependabot-review-facts # zizmor: ignore[self-repository]
        with:
          lockfile: no-such-lockfile.json
          out: ${{ runner.temp }}/no-facts.json
          working-directory: test/fixtures/project

      - name: dependabot-review (must fail)
        id: dependabot-review
        continue-on-error: true
        uses: ./.github/actions/dependabot-review # zizmor: ignore[self-repository]
        with:
          api-key: not-a-secret
          facts: ${{ runner.temp }}/facts.json
          api-url: http://127.0.0.1:8787/bad
          comment-file: ${{ runner.temp }}/no-comment.md

      - name: docs-check (must fail)
        id: docs-check
        continue-on-error: true
        uses: ./.github/actions/docs-check # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/docs-check/fail

      - name: node-patch-check (must fail)
        id: node-patch-check
        continue-on-error: true
        uses: ./.github/actions/node-patch-check # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/node-patch-check/fail

      - name: baseline-check (must fail)
        id: baseline-check
        continue-on-error: true
        uses: ./.github/actions/baseline-check # zizmor: ignore[self-repository]
        with:
          working-directory: test/fixtures/baseline-check/fail

      # `outcome` is the result before continue-on-error turns it green.
      - name: Each fixture that must fail failed
        env:
          COVERAGE_RATCHET: ${{ steps.coverage-ratchet.outcome }}
          AUDIT_CHECK: ${{ steps.audit-check.outcome }}
          LICENCE_CHECK: ${{ steps.licence-check.outcome }}
          PACKAGE_CONTENTS_CHECK: ${{ steps.package-contents-check.outcome }}
          LOCKFILE_NESTING_CHECK: ${{ steps.lockfile-nesting-check.outcome }}
          DEPENDABOT_REVIEW_FACTS: ${{ steps.dependabot-review-facts.outcome }}
          DEPENDABOT_REVIEW: ${{ steps.dependabot-review.outcome }}
          DOCS_CHECK: ${{ steps.docs-check.outcome }}
          NODE_PATCH_CHECK: ${{ steps.node-patch-check.outcome }}
          BASELINE_CHECK: ${{ steps.baseline-check.outcome }}
        run: |
          status=0
          for name in COVERAGE_RATCHET AUDIT_CHECK LICENCE_CHECK PACKAGE_CONTENTS_CHECK LOCKFILE_NESTING_CHECK DEPENDABOT_REVIEW_FACTS DEPENDABOT_REVIEW DOCS_CHECK NODE_PATCH_CHECK BASELINE_CHECK; do
            if [ "${!name}" != failure ]; then
              echo "::error::The fixture for ${name} that must fail ended in '${!name}'."
              status=1
            fi
          done
          exit "$status"

  workflow-lint:
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository]

  # Published from main and the schedule only. On a pull request it scores
  # the branch, which proves the workflow is callable, and publishes nothing.
  scorecard:
    uses: ./.github/workflows/scorecard.yml # zizmor: ignore[self-repository]
    with:
      publish-results: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      upload-sarif: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write

  security:
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: read
