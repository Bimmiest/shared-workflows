name: PR hygiene

# The branch and issue convention, enforced on this repository by its own
# action. `edited` because fixing the description is how most failures get
# fixed, and `labeled`/`unlabeled` because `no-issue` and `no-changelog`
# change the verdict.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # `pr-hygiene`, the same job name the template uses, so the required status
  # check is one name in every repository.
  pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # `./` rather than `$/`, for the reason ci.yml gives: actionlint does not
      # accept the self-repository syntax yet.
      - uses: ./.github/actions/pr-hygiene # zizmor: ignore[self-repository]

      # What a consumer gets from a bump is the actions and the reusable
      # workflows, so a change to those needs a CHANGELOG line (CONTRIBUTING).
      - uses: ./.github/actions/changelog-check # zizmor: ignore[self-repository]
        with:
          paths: .github/actions/**,.github/workflows/security.yml,.github/workflows/workflow-lint.yml,.github/workflows/scorecard.yml
          ignore: '**/*.test.mjs'

