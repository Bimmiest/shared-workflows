name: Dependabot review
description: >-
  Advice on a dependency update: one request to the Messages API, which reads
  the release notes against where the repository uses each package, and one
  comment on the pull request with its verdict. It does not read the code of
  the packages, and the comment says so. The verdict is never a check
  result, and the step fails only when it cannot write the comment. Run it in a
  job that holds the credential and does not check out the pull request; the
  facts come from dependabot-review-facts as an artifact.
inputs:
  api-key:
    description: An Anthropic API key, from a secret, when there is no federation rule, or as its fallback. Use a key from a workspace that is only for CI, with a monthly spend limit.
    default: ''
  federation-rule-id:
    description: 'A workload identity federation rule (`fdrl_...`). With the organization and the service account, the job exchanges its GitHub identity token for a short-lived access token, and needs `id-token: write`.'
    default: ''
  organization-id:
    description: The Anthropic organization ID, for federation.
    default: ''
  service-account-id:
    description: The service account (`svac_...`) that the federation rule targets.
    default: ''
  workspace-id:
    description: The workspace (`wrkspc_...`), when the federation rule covers more than one.
    default: ''
  facts:
    description: The JSON file that dependabot-review-facts wrote.
    default: dependabot-review-facts.json
  model:
    description: 'The model, pinned. It must accept `fallbacks: "default"`.'
    default: claude-opus-5-5
  github-token:
    description: 'The token that writes the comment. The job needs `pull-requests: write`.'
    default: ${{ github.token }}
  comment-file:
    description: Write the comment to this file instead of posting it.
    default: ''
  api-url:
    description: The base URL of the Messages API.
    default: https://api.anthropic.com
  working-directory:
    description: Where the paths are resolved from.
    default: .
runs:
  using: composite
  steps:
    # The job holds the credential and has no checkout, so it has no .nvmrc of
    # its own. This repository's .nvmrc pins the Node of review.mjs instead,
    # so a release moves it and node-patch-check keeps it current (#106).
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ github.action_path }}/../../../.nvmrc
    - name: Review the update, and comment
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation-rule-id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization-id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service-account-id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace-id }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        FACTS: ${{ inputs.facts }}
        MODEL: ${{ inputs.model }}
        COMMENT_FILE: ${{ inputs.comment-file }}
        API_URL: ${{ inputs.api-url }}
        SCRIPT: ${{ github.action_path }}/review.mjs
      run: |
        if [ -n "$COMMENT_FILE" ]; then
          node "$SCRIPT" --facts "$FACTS" --model "$MODEL" --api-url "$API_URL" --comment-file "$COMMENT_FILE"
        else
          node "$SCRIPT" --facts "$FACTS" --model "$MODEL" --api-url "$API_URL"
        fi
